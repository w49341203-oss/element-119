<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="author" content="© 2026 蕭妤真">
<title>消失的第 119 號元素・平板</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="content.js?v=2.4"></script>
<script src="audio/list.js?v=2.4"></script>
<style>
  :root { --bg:#0e1621; --card:#18232f; --card2:#202e3c; --line:#2c3b4a; --txt:#eef3f8; --dim:#93a4b5; --ok:#3ddc84; --bad:#ff5c5c; --wait:#f5c542; --acc:#4fb3ff; --acc2:#9b7bff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; -webkit-user-select:none; user-select:none; }
  body { overscroll-behavior:none; }
  .hide { display:none !important; }
  button { font:inherit; font-size:20px; padding:12px 18px; border-radius:14px; border:2px solid var(--line); background:var(--card2); color:var(--txt); cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.45; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:bold; }
  button.big { display:block; width:100%; font-size:26px; padding:20px; margin-top:18px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--wait); } .dim { color:var(--dim); }
  .wrap { max-width:760px; margin:0 auto; padding:16px 16px 110px; }
  h1 { font-size:28px; margin:8px 0 16px; } h2 { font-size:24px; margin:4px 0 10px; }
  .ver { position:fixed; right:8px; bottom:4px; color:var(--dim); font-size:12px; z-index:60; pointer-events:none; }
  label.l { display:block; font-size:19px; color:var(--dim); margin:16px 0 8px; }
  input.code { font:inherit; font-size:34px; width:100%; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--txt); letter-spacing:6px; text-align:center; }
  .groups { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .groups button { font-size:28px; padding:16px 0; }
  .groups button.sel { background:var(--acc); color:#04121f; border-color:var(--acc); font-weight:bold; }
  .card { background:var(--card); border-radius:16px; padding:16px 18px; margin-top:14px; }
  /* 上方列 */
  #bar { position:sticky; top:0; z-index:20; background:rgba(14,22,33,.96); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:10px; }
  #bar .who { font-size:20px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #bar .sp { flex:1; }
  .dots { display:flex; gap:6px; }
  .dots i { width:16px; height:16px; border-radius:50%; background:#33414f; display:inline-block; }
  .dots i.on { background:var(--ok); }
  .net { width:12px; height:12px; border-radius:50%; background:var(--ok); }
  .net.off { background:var(--bad); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  #bar button { font-size:15px; padding:6px 10px; }
  /* 下方分頁 */
  #tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; background:#121c27; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  #tabs button { flex:1; border:none; border-radius:0; background:transparent; font-size:17px; padding:10px 0 12px; color:var(--dim); }
  #tabs button b { display:block; font-size:26px; }
  #tabs button.sel { color:var(--acc); }
  #tabs button .badge { background:var(--bad); color:#fff; border-radius:10px; font-size:12px; padding:1px 6px; margin-left:4px; }
  /* 簡訊 */
  .sms { display:flex; gap:10px; align-items:flex-start; margin:12px 0; }
  .sms .av { width:46px; height:46px; border-radius:50%; background:#2f5d82; display:flex; align-items:center; justify-content:center; font-size:26px; flex:none; }
  .sms .bub { background:var(--card2); border-radius:4px 16px 16px 16px; padding:12px 14px; font-size:20px; line-height:1.55; }
  .loc { color:var(--wait); font-weight:bold; }
  .task { font-size:22px; line-height:1.6; }
  /* 題目 */
  .ptitle { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ptitle .n { color:var(--dim); font-size:16px; white-space:nowrap; }
  .story { font-size:19px; line-height:1.6; color:#cfdbe7; }
  .prompt { font-size:22px; line-height:1.55; margin:14px 0 10px; font-weight:bold; white-space:pre-line; }
  .opts { display:grid; gap:10px; }
  .opts button { text-align:left; font-size:20px; line-height:1.4; }
  .opts button.sel, .seg button.sel, .tfrow button.sel { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:bold; }
  .item { background:var(--card2); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .item .t { font-size:21px; font-weight:bold; }
  .item .d { font-size:16px; color:var(--dim); margin-top:2px; }
  .seg { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .seg button { flex:1; font-size:18px; padding:10px 6px; min-width:70px; }
  .tfrow { display:flex; gap:8px; margin-top:8px; }
  .tfrow button { flex:1; }
  .mrow { display:flex; align-items:center; gap:12px; margin:8px 0; }
  .mrow .sym { font-size:30px; font-weight:bold; width:70px; text-align:center; background:var(--card2); border-radius:10px; padding:6px 0; }
  select { font:inherit; font-size:20px; flex:1; padding:10px; border-radius:10px; background:var(--card2); color:var(--txt); border:2px solid var(--line); }
  .numrow { display:flex; align-items:center; gap:12px; margin:10px 0; font-size:21px; }
  .numrow input { font:inherit; font-size:28px; width:120px; padding:8px; border-radius:10px; border:2px solid var(--line); background:var(--card2); color:var(--txt); text-align:center; -webkit-user-select:text; user-select:text; }
  .ocards button { display:block; width:100%; text-align:left; margin:8px 0; font-size:19px; line-height:1.45; position:relative; padding-left:54px; }
  .ocards button .k { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:#33414f; display:flex; align-items:center; justify-content:center; font-size:17px; }
  .ocards button.sel .k { background:#04121f; color:var(--acc); }
  .ocards button.sel { background:var(--acc); color:#04121f; border-color:var(--acc); }
  .actions { display:flex; gap:10px; margin-top:16px; }
  .actions .pri { flex:1; font-size:24px; padding:16px; }
  .fb { margin-top:12px; font-size:21px; min-height:30px; text-align:center; }
  /* 週期表 */
  .pt { display:grid; grid-template-columns:28px repeat(8,1fr); gap:4px; margin-top:8px; }
  .pt div { text-align:center; font-size:13px; color:var(--dim); padding:4px 0; }
  .pt button { padding:6px 0; font-size:18px; border-radius:8px; min-height:48px; line-height:1.1; }
  .pt button small { display:block; font-size:11px; color:var(--dim); }
  .pt button.sel { background:var(--acc); border-color:var(--acc); color:#04121f; }
  .pt button.sel small { color:#04121f; }
  .pt .gap { visibility:hidden; }
  .cell { display:inline-block; border:3px solid var(--txt); border-radius:8px; padding:8px 18px; text-align:center; background:var(--card2); margin:6px 0; min-width:150px; }
  .cell .z { text-align:left; font-size:22px; font-weight:bold; }
  .cell .s { font-size:48px; font-weight:bold; line-height:1.1; }
  .cell .nm { font-size:18px; } .cell .aw { font-size:18px; }
  .atom { display:inline-flex; align-items:center; gap:4px; background:var(--card2); border-radius:12px; padding:10px 22px; margin:6px 0; }
  .atom .nums { display:flex; flex-direction:column; justify-content:space-between; font-size:24px; font-weight:bold; height:72px; text-align:right; }
  .atom .s { font-size:64px; font-weight:bold; }
  /* 全螢幕層 */
  .layer { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:60px 20px 70px; background:linear-gradient(180deg,#16324a,#0b1520); }
  .bigav { width:150px; height:150px; border-radius:50%; background:#2f5d82; display:flex; align-items:center; justify-content:center; font-size:80px; margin:0 auto; }
  #ring .bigav { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(79,179,255,.6); } 50% { box-shadow:0 0 0 30px rgba(79,179,255,0); } }
  .center { text-align:center; }
  .nm1 { font-size:38px; font-weight:bold; margin-top:16px; } .nm2 { font-size:20px; color:#b9cde0; margin-top:6px; }
  .answer { width:110px; height:110px; border-radius:50%; background:#2ecc71; border:none; font-size:52px; box-shadow:0 6px 20px rgba(46,204,113,.5); }
  .subt { font-size:25px; line-height:1.6; text-align:center; background:rgba(0,0,0,.35); border-radius:14px; padding:16px 18px; min-height:130px; width:100%; max-width:680px; }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal .box { background:var(--card); border-radius:18px; padding:20px; width:100%; max-width:640px; max-height:90vh; overflow:auto; }
  #scan { background:#000; justify-content:center; gap:16px; }
  #scan video { width:100%; max-width:620px; border-radius:14px; background:#111; }
  .lockbar { margin-top:10px; height:8px; border-radius:4px; background:#33414f; overflow:hidden; }
  .lockbar i { display:block; height:100%; background:var(--bad); }
  .piece { font-size:60px; text-align:center; margin:10px 0; }
  .testi { background:var(--card2); border-radius:12px; padding:12px 14px; margin:10px 0; font-size:19px; line-height:1.55; display:flex; gap:12px; }
  .testi .av { font-size:34px; }
  .vote { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .vote button { padding:12px 4px; font-size:16px; }
  .vote button b { display:block; font-size:34px; }
  .vote button.sel { background:var(--acc2); border-color:var(--acc2); }
  svg text { font-family:inherit; }
</style>
</head>
<body>
<div class="ver" id="ver"></div>

<!-- 加入 -->
<div class="wrap" id="sJoin">
  <h1>🔬 消失的第 119 號元素</h1>
  <label class="l">房間代碼（白板上的 4 位數字）</label>
  <input class="code" id="iCode" inputmode="numeric" maxlength="4" autocomplete="off">
  <label class="l">我們是第幾組？</label>
  <div class="groups" id="groups"></div>
  <button class="big pri" id="bJoin">連線</button>
  <div class="card dim" id="joinStat" style="font-size:19px">選好組別後按「連線」。</div>
</div>

<!-- 準備 -->
<div class="wrap hide" id="sReady">
  <h1>第 <span class="gno"></span> 組・已連線 ✔</h1>
  <p style="font-size:22px;line-height:1.6">等一下你們會接到一通電話。<br>先按下面的按鈕，讓這台平板可以發出聲音、螢幕保持亮著。</p>
  <button class="big pri" id="bReady">✋ 我們準備好了</button>
</div>

<!-- 遊戲主畫面 -->
<div id="sGame" class="hide">
  <div id="bar"><span class="who" id="barWho"></span><span class="dots" id="barDots"></span><span class="sp"></span><span class="net" id="net"></span><button id="bFs">⛶</button></div>
  <div class="wrap" id="main"></div>
  <div id="tabs">
    <button data-t="task" class="sel"><b>🎯</b>任務</button>
    <button data-t="sms"><b>💬</b>簡訊</button>
    <button data-t="case"><b>🔍</b>案件</button>
    <button data-t="note"><b>📒</b>筆記</button>
  </div>
</div>

<!-- 來電 -->
<div class="layer hide" id="ring">
  <div class="center"><div class="bigav" id="rAv"></div><div class="nm1" id="rName"></div><div class="nm2">來電中…</div></div>
  <div class="center" style="font-size:22px"><button class="answer" id="bAnswer">📞</button><div style="margin-top:12px;color:#b9cde0">接聽　<span id="autoT">5</span> 秒後自動接通</div></div>
</div>
<!-- 通話 -->
<div class="layer hide" id="call">
  <div class="center"><div class="bigav" id="cAv"></div><div class="nm1" id="cName"></div><div class="nm2" id="cTime">通話中</div></div>
  <div class="subt" id="subt"></div>
  <button class="pri hide" id="bCallEnd" style="font-size:24px;padding:16px 30px">通話結束，開始任務 →</button>
</div>
<!-- 掃描 -->
<div class="layer hide" id="scan">
  <video id="vid" playsinline muted autoplay></video>
  <div id="scanTip" style="font-size:23px;text-align:center"></div>
  <button id="bScanX">關閉相機</button>
</div>
<!-- 暫停／斷線／訊息 -->
<div class="modal hide" id="pause"><div class="box center"><div style="font-size:60px">⏸</div><h2>老師暫停中</h2><p class="dim" style="font-size:19px">請看白板、聽老師說明。</p></div></div>
<div class="modal hide" id="msgBox"><div class="box"><div id="msgBody"></div><button class="big pri" id="msgOk">知道了</button></div></div>
<div class="modal hide" id="ptBox"><div class="box"><h2>📋 週期表（第 1～4 週期、主族）</h2><div id="ptRef"></div><button class="big" id="ptClose">關閉</button></div></div>

<audio id="au" playsinline preload="auto"></audio>

<script>
(function () {
  "use strict";
  var G = window.GAME, AUD = window.AUDIO_LIST || {}, VER = G.VER, PREFIX = "hhm119-";
  var $ = function (id) { return document.getElementById(id); };
  $("ver").textContent = VER + "　© 2026 蕭妤真";
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- 測試參數（自動化測試用；正式使用不會帶） ---------- */
  var Q = location.search;
  var tDev = Q.match(/[?&]dev=(\w{1,20})/), tG = Q.match(/[?&]g=([1-9])/), tAuto = /[?&]auto=1/.test(Q);
  var devId = lsGet("hhm119Dev"); if (!devId) { devId = Math.random().toString(36).slice(2, 10); lsSet("hhm119Dev", devId); }
  if (tDev) devId = tDev[1];

  /* ---------- 狀態 ---------- */
  var group = 0, code = "", peer = null, conn = null, joined = false, stopped = false, force = false, retryT = null;
  var S = null;               // 白板送來的狀態 { phase, paused, gs, ... }
  var C = null, STG = null, ROUTE = null, BONUS = null;
  var unlockedAudio = false, tab = "task", ui = {}, lockUntil = 0, lastRenderKey = "";
  var au = $("au");

  /* ---------- 亂數（同組同題固定順序） ---------- */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffled(n, seed) { var r = rng(seed), a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { var k = Math.floor(r() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; }

  /* ---------- 加入 ---------- */
  var qr = Q.match(/[?&]r=(\d{4})/);
  $("iCode").value = qr ? qr[1] : (lsGet("hhm119Code") || "");
  var lastG = parseInt(lsGet("hhm119Group") || "0", 10);
  var gb = ""; for (var i = 1; i <= 9; i++) gb += '<button data-g="' + i + '"' + (i === lastG ? ' class="sel"' : "") + ">" + i + "</button>";
  $("groups").innerHTML = gb; if (lastG >= 1 && lastG <= 9) group = lastG;
  if (tG) group = parseInt(tG[1], 10);
  $("groups").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; group = parseInt(b.dataset.g, 10);
    var all = $("groups").querySelectorAll("button"); for (var j = 0; j < all.length; j++) all[j].classList.toggle("sel", all[j] === b);
  });
  function joinStat(t, c) { $("joinStat").innerHTML = '<span class="' + (c || "") + '">' + t + "</span>"; }
  function setGroupData() {
    C = G.CALLERS[group]; STG = G.stagesFor(group); ROUTE = G.routeOf(group); BONUS = G.bonus(group);
    var els = document.querySelectorAll(".gno"); for (var k = 0; k < els.length; k++) els[k].textContent = group;
  }
  $("bJoin").addEventListener("click", function () {
    code = $("iCode").value.replace(/\D/g, "");
    if (code.length !== 4) { joinStat("請輸入白板上的 4 位數代碼", "bad"); return; }
    if (!(group >= 1 && group <= 9)) { joinStat("請選組別", "bad"); return; }
    lsSet("hhm119Code", code); lsSet("hhm119Group", String(group));
    setGroupData(); stopped = false; force = false; connect();
  });
  function showScreen(id) { ["sJoin", "sReady", "sGame"].forEach(function (s) { $(s).classList.toggle("hide", s !== id); }); }

  /* ---------- 連線 ---------- */
  function send(o) { try { if (conn && conn.open) conn.send(o); } catch (e) {} }
  function netOn(on) { $("net").classList.toggle("off", !on); }
  function scheduleRetry() { clearTimeout(retryT); retryT = setTimeout(connect, 3000); }
  function connect() {
    clearTimeout(retryT);
    if (typeof Peer === "undefined") { joinStat("連線元件載入失敗（沒有網路？）", "bad"); return; }
    if (!joined) joinStat("連線中…", "wait");
    function dial() {
      var old = conn; conn = null; try { if (old) old.close(); } catch (e) {}
      var c = peer.connect(PREFIX + code, { serialization: "json", reliable: true }); conn = c;
      c.on("open", function () { if (c === conn) send({ t: "hello", g: group, dev: devId, ver: VER, force: force }); });
      c.on("data", function (d) { if (c === conn) onData(d); });
      c.on("close", function () { if (c !== conn || stopped) return; netOn(false); scheduleRetry(); });
      c.on("error", function () { if (c === conn && !stopped) scheduleRetry(); });
    }
    if (peer && !peer.destroyed && peer.open) { dial(); return; }
    try { if (peer) peer.destroy(); } catch (e) {}
    peer = new Peer();
    peer.on("open", dial);
    peer.on("disconnected", function () { try { peer.reconnect(); } catch (e) {} });
    peer.on("error", function (e) {
      if (!joined) joinStat(e.type === "peer-unavailable" ? "找不到這個房間（白板開了嗎？代碼對嗎？）自動重試中…" : "連線錯誤：" + e.type + "，自動重試中…", "bad");
      netOn(false);
      if (e.type !== "peer-unavailable") { try { peer.destroy(); } catch (x) {} peer = null; }
      scheduleRetry();
    });
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (unlockedAudio && !wakeLock) askWake();
    if (joined && !stopped && (!conn || !conn.open)) connect();
  });

  function onData(d) {
    if (!d || typeof d !== "object") return;
    if (d.t === "ping") { send({ t: "pong", id: d.id }); return; }
    if (d.t === "welcome") {
      var first = !joined; joined = true; force = false; netOn(true);
      if (first) showScreen(unlockedAudio ? "sGame" : "sReady");
      if (unlockedAudio) send({ t: "ready" });
      return;
    }
    if (d.t === "taken") {
      showScreen("sJoin");
      joinStat('第 ' + group + ' 組已經有別台平板在用。<br><button id="bForce" style="margin-top:10px">原本那台壞了，把這組換到這台</button>', "bad");
      $("bForce").onclick = function () { force = true; send({ t: "hello", g: group, dev: devId, ver: VER, force: true }); };
      return;
    }
    if (d.t === "kicked") { stopped = true; joined = false; clearTimeout(retryT); try { conn.close(); } catch (e) {} showScreen("sJoin"); joinStat("這組已經換到別台平板了。", "bad"); return; }
    if (d.t === "state") { S = d; netOn(true); onState(); return; }
    if (d.t === "teacherHint") { showHint(true); return; }
  }

  /* ---------- 準備：解鎖聲音＋螢幕常亮 ---------- */
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  var wakeLock = null;
  function askWake() {
    if (!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; l.addEventListener("release", function () { wakeLock = null; }); }).catch(function () {});
  }
  $("bReady").addEventListener("click", function () {
    au.loop = false; au.src = "audio/silent.wav";
    var p = au.play(); if (p && p.catch) p.catch(function () {});
    unlockedAudio = true; askWake();
    send({ t: "ready" }); showScreen("sGame"); onState();
  });
  $("bFs").addEventListener("click", function () {

    var used = g.hints && g.hints[p.id];
    if (fromTeacher || used) { msg("💡 提示" + (fromTeacher ? "（老師送的，不加時間）" : ""), p.hint); if (fromTeacher) send({ t: "hintSeen", id: p.id }); return; }
    msg("💡 要看提示嗎？", "看提示會讓你們的總時間 <b>+" + G.RULES.hintSec + " 秒</b>。", function () { send({ t: "hint", id: p.id }); msg("💡 提示", p.hint); });
  }
  function msg(title, body, onYes) {
    $("msgBody").innerHTML = "<h2>" + title + '</h2><div style="font-size:21px;line-height:1.6">' + body + "</div>" + (onYes ? '<button class="big" id="msgNo">不用了</button>' : "");
    $("msgBox").classList.remove("hide");
    $("msgOk").textContent = onYes ? "看提示" : "知道了";
    $("msgOk").onclick = function () { $("msgBox").classList.add("hide"); if (onYes) onYes(); };
    if (onYes) $("msgNo").onclick = function () { $("msgBox").classList.add("hide"); };
  }

  /* ---------- 完成、深層調查 ---------- */
  function doneView() {
    var g = gs(), h = '<div class="card center"><div class="piece">🎉</div><h2>四關都完成了！</h2><div style="font-size:20px;line-height:1.6">' + esc(C.done) + '</div><p class="dim" style="font-size:18px">證物都放進「🔍 案件」了，記得去看。</p></div>';
    if (S.phase !== "play" && S.phase !== "exchange") return h;
    var b = g.bonus || [null, null, null], idx = -1;
    for (var i = 0; i < 3; i++) if (b[i] == null) { idx = i; break; }
    h += '<div class="card"><h2>🕵️ 深層調查（每題只能答一次）</h2><p style="font-size:19px;line-height:1.6">答對才拿得到深層線索（動機、匿名者的真面目……），總時間也 −' + G.RULES.bonusSec + " 秒。</p>";
    h += '<div style="font-size:20px">' + b.map(function (x, i) { return "線索 " + (i + 1) + "：" + (x == null ? "🔒" : x ? '<span class="ok">✔ 已取得</span>' : '<span class="bad">✘ 錯失</span>'); }).join("　") + "</div>";
    if (idx < 0) { h += '<p style="font-size:20px">深層調查結束！到「🔍 案件」整理線索，準備指認。</p></div>'; return h; }
    var st = BONUS[idx]; ui.bonusIdx = idx;
    h += stepHTML({ id: "B" + idx }, st, 0) + '<div class="actions">' + (st.table ? "" : '<button id="bPT2">📋 週期表</button>') + '<button class="pri" id="bBonus">送出（只有一次機會）</button></div><div class="fb" id="fb"></div></div>';
    return h;
  }
  function bindDone() {
    if (!$("bBonus")) return;
    var st = BONUS[ui.bonusIdx], m = $("main");
    if ($("bPTin")) $("bPTin").onclick = openPT; if ($("bPT2")) $("bPT2").onclick = openPT;
    if (st.type === "choice") $("opts").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; ui.sel = +b.dataset.i; selIn($("opts"), b); };
    if (st.type === "nums") m.querySelectorAll("input").forEach(function (inp) { inp.oninput = function () { inp.value = inp.value.replace(/\D/g, "").slice(0, 3); }; });
    $("bBonus").onclick = function () {
      var r = check(st); if (r === null) { $("fb").innerHTML = '<span class="wait">還沒作答喔</span>'; return; }
      $("bBonus").disabled = true; send({ t: "bonus", i: ui.bonusIdx, ok: r === 0 });
      $("fb").innerHTML = r === 0 ? '<span class="ok">✔ 答對了！拿到深層線索</span>' : '<span class="bad">✘ 可惜答錯了，這條線索錯失</span>';
    };
  }

  /* ---------- 🔍 案件：嫌疑人、證物、情報、推理表 ---------- */
  var intelOpen = function () { return S && (S.phase === "exchange" || S.phase === "accuse" || S.phase === "reveal" || S.phase === "end"); };
  function gridGet() { try { return JSON.parse(lsGet("hhm119Grid_" + group + "_" + (S && S.runId || "")) || "{}"); } catch (e) { return {}; } }
  function gridSet(v) { lsSet("hhm119Grid_" + group + "_" + (S && S.runId || ""), JSON.stringify(v)); }
  function caseView() {
    var g = gs(), h = "<h2>🔍 案件檔案</h2>", grid = gridGet();
    h += '<div class="card"><h2>👥 嫌疑人（點一下標記：❓懷疑 → ❌排除 → ⭐兇手）</h2>';
    G.SUSPECTS.forEach(function (s) {
      var m = grid[s.id] || 0, mk = ["❓", "❌", "⭐"][m];
      h += '<div class="item" data-sus="' + s.id + '" style="cursor:pointer;' + (m === 1 ? "opacity:.45;" : "") + (m === 2 ? "border:2px solid var(--wait);" : "") + '"><div class="t">' + mk + " " + s.av + " " + esc(s.name) + '　<span class="dim" style="font-size:16px;font-weight:normal">' + esc(s.role) + '</span></div><div class="d">' + s.facts.map(esc).join("／") + "</div></div>";
    });
    h += "</div>";
    h += '<div class="card"><h2>🧾 證物卡（每完成一關拿一張）</h2>';
    var any = false;
    for (var i = 0; i < 4; i++) if (g.stage > i) { any = true; var c = G.STATIONS[ROUTE[i]].card; h += '<div class="testi"><span class="av">' + G.STATIONS[ROUTE[i]].icon + "</span><span><b>" + esc(c.t) + "</b><br>" + esc(c.d) + "</span></div>"; }
    if (!any) h += '<p class="dim" style="font-size:18px">還沒有證物。完成第 1 關就會拿到第一張。</p>';
    h += "</div>";
    h += '<div class="card"><h2>📨 ' + esc(C.name) + " 給你們的獨家情報</h2>";
    if (intelOpen()) {
      h += '<div class="testi"><span class="av">' + C.av + "</span><span>" + esc(G.INTEL[group]) + "</span></div>";
      h += '<div class="testi"><span class="av">' + C.av + "</span><span><b>證詞：</b>「" + esc(C.testimony) + "」</span></div>";
      h += '<p class="dim" style="font-size:17px">只有你們有這條情報。要不要告訴別組、要換什麼，你們自己決定。</p>';
    } else h += '<p class="dim" style="font-size:18px">🔒 老師宣布「情報交換時間」後才會打開。</p>';
    h += "</div>";
    if (intelOpen() && G.SECRET[group]) h += '<div class="card" style="border:2px solid var(--acc2)"><h2>' + esc(G.SECRET[group].t) + '（只有你們看得到）</h2><p style="font-size:20px;line-height:1.6">' + esc(G.SECRET[group].d) + "</p></div>";
    var deep = (g.bonus || []).map(function (x, i) { return x === true ? G.DEEP[i] : null; }).filter(Boolean);
    if (deep.length) h += '<div class="card"><h2>🕵️ 深層線索</h2>' + deep.map(function (d) { return '<div class="testi"><span class="av">🗝️</span><span><b>' + esc(d.t) + "</b><br>" + esc(d.d) + "</span></div>"; }).join("") + "</div>";
    return h;
  }
  function bindCase() {
    $("main").querySelectorAll("[data-sus]").forEach(function (el) {
      el.onclick = function () { var gd = gridGet(), id = el.dataset.sus; gd[id] = ((gd[id] || 0) + 1) % 3; gridSet(gd); render(true); };
    });
  }

  /* ---------- 指認 ---------- */
  function accuseView() {
    var g = gs(), h = '<div class="card"><h2>⚖️ 最後指認</h2><p style="font-size:19px;line-height:1.6">全組討論好再送出，<b>只能送一次</b>。可以先到「🔍 案件」整理線索。</p>';
    if (g.accuse) {
      h += G.ACCUSE.map(function (q) { return '<p style="font-size:20px">' + esc(q.q) + "<br><b>" + esc(q.o[g.accuse[q.id]]) + "</b></p>"; }).join("");
      return h + '<p class="dim" style="font-size:20px">✔ 已送出，等待老師揭曉…</p></div>';
    }
    ui.acc = {};
    G.ACCUSE.forEach(function (q) {
      var ord = shuffled(q.o.length, group * 31 + hashStr(q.id));
      h += '<div class="prompt">' + esc(q.q) + '</div><div class="opts" data-q="' + q.id + '">' + ord.map(function (oi) { return '<button data-i="' + oi + '">' + esc(q.o[oi]) + "</button>"; }).join("") + "</div>";
    });
    return h + '<button class="big pri" id="bAccuse">送出指認（不能修改）</button><div class="fb" id="fb"></div></div>';
  }
  function bindAccuse() {
    if (!$("bAccuse")) return;
    $("main").querySelectorAll(".opts[data-q]").forEach(function (box) {
      box.onclick = function (e) { var b = e.target.closest("button"); if (!b) return; ui.acc[box.dataset.q] = +b.dataset.i; selIn(box, b); };
    });
    $("bAccuse").onclick = function () {
      for (var i = 0; i < G.ACCUSE.length; i++) if (!(G.ACCUSE[i].id in ui.acc)) { $("fb").innerHTML = '<span class="wait">四題都要選喔</span>'; return; }
      $("bAccuse").disabled = true; send({ t: "accuse", ans: ui.acc });
    };
  }

  /* ---------- 結局 ---------- */
  function finaleView() {
    var g = gs(), h = '<div class="card"><h2>🔎 真相揭曉中…請看白板</h2>';
    if (g.accuse) h += G.ACCUSE.map(function (q) { var my = g.accuse[q.id], ok = my === q.a; return '<p style="font-size:20px">' + esc(q.q) + "<br>你們：<b>" + esc(q.o[my]) + "</b>" + (S.revealStep >= 1 ? (ok ? ' <span class="ok">✔ 正確（−' + q.sec + " 秒）</span>" : ' <span class="bad">✘</span>（答案：' + esc(q.o[q.a]) + "）") : "") + "</p>"; }).join("");
    else h += '<p style="font-size:20px">你們沒有送出指認。</p>';
    h += "</div>";
    if (S.phase === "end" && S.rank) {
      var me = null; S.rank.forEach(function (r) { if (r.g === group) me = r; });
      if (me) h += '<div class="card center"><h2>🏆 你們是第 ' + me.place + " 名</h2><p style=\"font-size:20px\">" + esc(me.text) + "</p></div>";
    }
    return h;
  }

  /* ---------- 週期表 ---------- */
  function ptHTML(pickable) {
    var cols = [1, 2, 13, 14, 15, 16, 17, 18], h = '<div class="pt"><div></div>' + cols.map(function (c) { return "<div>" + c + "族</div>"; }).join("");
    for (var per = 1; per <= 4; per++) {
      h += "<div>" + per + "</div>";
      cols.forEach(function (c) {
        var e = null; G.PT.forEach(function (r) { if (r[2] === per && r[3] === c) e = r; });
        if (!e) { h += '<button class="gap" disabled>.</button>'; return; }
        h += '<button data-s="' + e[0] + '"' + (pickable ? "" : " disabled") + ">" + e[0] + "<small>" + e[1] + " " + esc(G.EL[e[0]][0]) + "</small></button>";
      });
    }
    return h + '</div><div class="dim" style="font-size:14px;margin-top:6px">橫列＝週期（左邊數字），直行＝族（上面數字）。格子裡：符號、原子序、名稱。</div>';
  }
  function openPT() { $("ptRef").innerHTML = ptHTML(false); $("ptBox").classList.remove("hide"); }
  $("ptClose").addEventListener("click", function () { $("ptBox").classList.add("hide"); });

  /* ---------- 圖：分子模型、粒子盒 ---------- */
  var ATOMC = { O: ["#e0473f", 24], H: ["#f2f2f2", 15], C: ["#2b2b2b", 22], N: ["#3f7de0", 22] };
  function ball(x, y, a, sw) { var c = ATOMC[a]; return '<circle cx="' + x + '" cy="' + y + '" r="' + (c[1] * (sw || 1)) + '" fill="' + c[0] + '" stroke="#9fb0c0" stroke-width="1.5"/>'; }
  function modelSVG(f) {
    var s = '<svg width="260" height="120" viewBox="0 0 260 120" style="background:#0b1218;border-radius:12px;margin:6px 0">';
    if (f === "H2O") s += ball(110, 78, "H") + ball(150, 78, "H") + ball(130, 58, "O");
    else if (f === "CO2") s += ball(88, 60, "O") + ball(172, 60, "O") + ball(130, 60, "C");
    else if (f === "CO") s += ball(112, 60, "C") + ball(150, 60, "O");
    else { var a = f.charAt(0); var r = ATOMC[a][1]; s += ball(130 - r * 0.8, 60, a) + ball(130 + r * 0.8, 60, a); }
    return s + "</svg>";
  }
  function boxSVG(kind, seed) {
    var r = rng(seed * 131 + 7), parts = [], i;
    var col = ["#e0473f", "#3f7de0", "#3ddc84", "#f5c542", "#c77dff"], pick = Math.floor(r() * 5);
    var c1 = col[pick], c2 = col[(pick + 2) % 5], c3 = col[(pick + 4) % 5];
    function di(c) { return [[c, 9], [c, 9]]; }
    if (kind === "E") for (i = 0; i < 6; i++) parts.push(di(c1));
    else if (kind === "C") for (i = 0; i < 6; i++) parts.push([[c1, 11], [c2, 7], [c2, 7]]);
    else if (kind === "M1") for (i = 0; i < 6; i++) parts.push(di(i % 2 ? c1 : c3));
    else for (i = 0; i < 6; i++) parts.push(i % 2 ? di(c2) : [[c3, 11], [c1, 7]]);
    var s = '<svg width="220" height="130" viewBox="0 0 220 130" style="background:#0b1218;border-radius:10px;border:2px solid #44566a;display:block;margin-bottom:6px">';
    parts.forEach(function (m, k) {
      var cx = 38 + (k % 3) * 72 + (r() * 16 - 8), cy = 36 + Math.floor(k / 3) * 58 + (r() * 12 - 6), ang = r() * Math.PI;
      if (m.length === 2) { var d = m[0][1] * 0.95; s += '<circle cx="' + (cx - Math.cos(ang) * d) + '" cy="' + (cy - Math.sin(ang) * d) + '" r="' + m[0][1] + '" fill="' + m[0][0] + '"/><circle cx="' + (cx + Math.cos(ang) * d) + '" cy="' + (cy + Math.sin(ang) * d) + '" r="' + m[1][1] + '" fill="' + m[1][0] + '"/>'; }
      else { s += '<circle cx="' + (cx - 12) + '" cy="' + (cy + 7) + '" r="' + m[1][1] + '" fill="' + m[1][0] + '"/><circle cx="' + (cx + 12) + '" cy="' + (cy + 7) + '" r="' + m[2][1] + '" fill="' + m[2][0] + '"/><circle cx="' + cx + '" cy="' + (cy - 3) + '" r="' + m[0][1] + '" fill="' + m[0][0] + '"/>'; }
    });
    return s + "</svg>";
  }

  /* ---------- 自動測試入口 ---------- */
  window.__pad = { get S() { return S; }, get group() { return group; }, get joined() { return joined; }, answer: answer, check: check, ui: function () { return ui; }, submit: function () { $("bSubmit").click(); }, handleCode: handleCode, endCall: function () { $("bCallEnd").click(); }, clearLock: function () { lockUntil = 0; } };
  if (tAuto && $("iCode").value.length === 4 && group) { code = $("iCode").value; setGroupData(); connect(); }
})();
</script>
</body>
</html>
